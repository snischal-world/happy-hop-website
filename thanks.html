<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you | Happy Hop Holidays</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#002440;--lime:#96ff01;--aqua:#12bfe9;--mute:#4d5f6b;--line:#e6edf1;--soft:#f5fafc}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;font:16px/1.6 Poppins,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);background:#fff}
h1,h2,h3{font-family:Chonburi,Georgia,serif;font-weight:400;line-height:1.15;margin:0 0 .5em}
h1{font-size:clamp(2rem,6vw,3.4rem)}h2{font-size:clamp(1.6rem,4vw,2.2rem)}h3{font-size:1.2rem}
a{color:inherit}img{max-width:100%;height:auto}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;z-index:9}.skip:focus{top:10px}
:focus-visible{outline:3px solid var(--aqua);outline-offset:3px}
header.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.logo{font:1.25rem Chonburi,Georgia,serif;text-decoration:none;color:var(--aqua)}.logo b{color:#6fd400;font-weight:400}
.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:600;padding:12px 24px;border-radius:999px;border:0;cursor:pointer;font:600 1rem inherit;font-family:inherit;min-height:44px}
.btn:hover{background:#1f3a4b}.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.hero{padding:56px 0 48px;text-align:center;background:radial-gradient(60% 80% at 10% 0,rgba(150,255,1,.35),transparent 70%),radial-gradient(60% 80% at 90% 10%,rgba(18,191,233,.3),transparent 70%)}
.hero p{max-width:34em;margin:0 auto 24px;color:var(--mute);font-size:1.08rem}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
section{padding:56px 0}.lead{color:var(--mute);max-width:36em}
.sale{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;border-radius:20px;padding:14px 20px;margin:0 0 22px;background:linear-gradient(100deg,rgba(150,255,1,.38),rgba(18,191,233,.26));border:1px solid rgba(0,36,64,.12)}
.sale .chip{background:var(--ink);color:var(--lime);font-weight:600;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:24px;padding:22px;background:#fff}
.dest .tg{color:var(--mute);font-size:.9rem;margin:0 0 10px}
.price s{color:#5d6e79;margin-right:8px}.price b{font:1.9rem Chonburi,Georgia,serif;font-weight:400;background:linear-gradient(transparent 62%,rgba(150,255,1,.6) 62%);padding:0 6px}
.price small{display:block;color:var(--mute);font-size:.8rem}
.fine{font-size:.85rem;color:var(--mute)}
.formcard{max-width:640px;margin:0 auto;border:1px solid var(--line);border-radius:28px;padding:clamp(20px,4vw,40px);background:var(--soft)}
label.f{display:block;font-weight:600;font-size:.9rem;margin-bottom:14px}
label.f input,label.f select{display:block;width:100%;margin-top:6px;padding:12px 14px;border:1.5px solid #cfdbe2;border-radius:14px;font:inherit;background:#fff;color:var(--ink);min-height:46px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:560px){.row{grid-template-columns:1fr}}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;margin:6px 0 16px}.consent input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--ink)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.formcard .btn{width:100%}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--mute);font-size:.9rem;background:var(--soft)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body>
<main id="main" class="hero" style="min-height:70vh;display:grid;align-content:center"><div class="wrap">
<h1>Thank you, we have it</h1>
<p>A member of our team will read your details and reply by email with options and rates.</p>
<div class="cta"><a class="btn" href="/">Back to the website</a><a class="btn alt" href="https://api.whatsapp.com/send?phone=61426555995">Message us on WhatsApp</a></div>
</div></main></body></html>
