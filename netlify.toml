# Netlify settings. Netlify reads this file automatically when you connect the GitHub repo.
[build]
  # Copies the public files into a folder called dist and leaves the template out of the live site.
  # Any new .html page you add to the main folder is published automatically.
  command = "mkdir -p dist && cp *.html sitemap.xml robots.txt dist/ && rm -f dist/landing-page-template.html"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

